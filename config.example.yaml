# LLM Coding Benchmark 配置文件 (示例)
# 复制为 config.yaml 后填入你的 API Key 即可使用
#   cp config.example.yaml config.yaml

settings:
  temperature: 0.0
  concurrency: 2               # 吞吐测试并发量
  throughput_multiplier: 1     # 吞吐请求数 = concurrency × multiplier
  consistency_runs: 1          # 一致性测试轮数
  max_quality_tasks: 2         # 质量题数上限 (0=不限)
  anti_cache: true             # prompt 追加随机 nonce 防缓存命中
  enable_judge: false          # Judge 模型评分 (需配置 judge 段)
  output_dir: ./results
  output_format:
    - terminal
    - json
  # difficulty: easy           # 只跑指定难度

# judge:                       # Judge 模型 (可选, 用强模型效果更好)
#   provider: openai
#   model: gpt-4o
#   api_key: "sk-xxx"

# ====================================
# Coding Plans - 两层配置结构
# ====================================
#
# 第一层 - Coding Plan (每家服务商一个):
#   api_key / env_key:  共享 API Key
#   api_type:           API 协议 (anthropic / openai), 默认 anthropic
#   base_url:           默认 API 地址
#   timeout:            默认超时 (秒)
#   max_tokens:         默认最大输出 token
#   retry_count:        默认重试次数
#
# 第二层 - Model (可覆盖 Plan 级别任何字段):
#   model:              必填, 模型 ID
#   name:               显示名称
#   api_type:           覆盖 API 协议
#   base_url:           覆盖 API 地址
#   thinking:           enabled / disabled
#   timeout / max_tokens / temperature 等均可覆盖

coding_plans:
  # === MiniMax Coding Plan (Anthropic 兼容, 服务端默认开启 thinking) ===
  minimax:
    name: "MiniMax"
    api_type: anthropic
    base_url: https://api.minimaxi.com/anthropic
    api_key: "<YOUR_MINIMAX_API_KEY>"
    max_tokens: 16384
    timeout: 180
    models:
      - name: MiniMax-M2.5
        model: MiniMax-M2.5

  # === 豆包 Coding Plan (火山引擎 ARK, Anthropic 兼容) ===
  doubao:
    name: "豆包"
    api_type: anthropic
    base_url: https://ark.cn-beijing.volces.com/api/coding
    api_key: "<YOUR_VOLCENGINE_API_KEY>"
    max_tokens: 32768
    models:
      - name: Doubao-Default
        model: doubao-seed-2.0-code
        timeout: 120
      - name: Doubao-Think-On
        model: doubao-seed-2.0-code
        timeout: 300
        thinking: enabled
      - name: Kimi-Think-On
        model: kimi-k2.5
        timeout: 300
        thinking: enabled
      - name: Kimi-Think-Off
        model: kimi-k2.5
        timeout: 120
        thinking: disabled

  # === Kimi Coding Plan (月之暗面, Anthropic 兼容) ===
  kimi:
    name: "Kimi"
    api_type: anthropic
    base_url: https://api.kimi.com/coding
    api_key: "<YOUR_KIMI_API_KEY>"
    max_tokens: 32768
    models:
      - name: Kimi-Native-Think-On
        model: kimi-k2.5
        timeout: 300
        thinking: enabled
      - name: Kimi-Native-Think-Off
        model: kimi-k2.5
        timeout: 120
        thinking: disabled

  # === 阿里云百炼 Coding Plan ===
  ali:
    name: "阿里云百炼"
    api_key: "<YOUR_DASHSCOPE_API_KEY>"
    api_type: openai
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    max_tokens: 32768
    timeout: 180
    models:
      - name: Qwen3-Coder-Plus
        model: qwen3-coder-plus
      - name: Qwen3.5-Plus
        model: qwen3.5-plus
      # Anthropic 兼容模型 (覆盖 api_type 和 base_url)
      # - name: Ali-Kimi-Think-On
      #   model: kimi-k2.5
      #   api_type: anthropic
      #   base_url: https://dashscope.aliyuncs.com/apps/anthropic
      #   timeout: 300
      #   thinking: enabled

  # === 联通云 CUCloud Coding Plan (OpenAI 兼容) ===
